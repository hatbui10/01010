<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Runner Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        h2 {
            color: #569cd6;
            margin-top: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #252526;
            border: 1px solid #333333;
            border-radius: 4px;
            overflow: hidden;
        }

        .pane-header {
            background-color: #2d2d2d;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #333333;
            color: #bbbbbb;
        }

        textarea {
            flex: 1;
            background-color: #1e1e1e;
            color: #9cdcfe;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .code-display {
            flex: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            overflow-y: auto;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* Hiệu ứng dòng sáng lên khi chạy */
        .code-line {
            padding: 2px 5px;
            border-radius: 3px;
        }

        .highlight-line {
            background-color: #264f78; /* Màu sáng mô phỏng VS Code breakpoint/active line */
            color: #ffffff;
            font-weight: bold;
            border-left: 3px solid #007acc;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background-color: #1177bb;
        }
    </style>
</head>
<body>

    <h2>VS Code Command Runner Simulator</h2>
    <div class="container">
        <div class="pane">
            <div class="pane-header">1. Nhập hoặc Dán Code vào đây</div>
            <textarea id="codeInput" placeholder="Nhập các dòng lệnh của bạn ở đây...
Ví dụ:
console.log('Bắt đầu chạy...');
let x = 10;
let y = 20;
console.log('Kết quả tổng là: ' + (x + y));"></textarea>
        </div>

        <div class="pane">
            <div class="pane-header">2. Màn hình thực thi (Live Highlight)</div>
            <div id="codeDisplay" class="code-display"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="runCode()">Chạy Code & Làm sáng dòng</button>
    </div>

    <script>
        function runCode() {
            const codeInput = document.getElementById('codeInput').value;
            const displayArea = document.getElementById('codeDisplay');
            
            // Xóa nội dung hiển thị cũ
            displayArea.innerHTML = '';

            // Tách code thành các dòng
            const lines = codeInput.split('\n');

            // Tạo các thẻ HTML tương ứng với từng dòng lệnh
            lines.forEach((line, index) => {
                const div = document.createElement('div');
                div.className = 'code-line';
                div.id = `line-${index}`;
                // Xử lý khoảng trắng để hiển thị đúng định dạng code
                div.textContent = line === '' ? ' ' : line;
                displayArea.appendChild(div);
            });

            // Mô phỏng quá trình chạy từng dòng bằng setInterval hoặc setTimeout
            let currentLine = 0;
            
            function executeNextLine() {
                if (currentLine > 0) {
                    // Tắt sáng dòng trước đó
                    const prevLine = document.getElementById(`line-${currentLine - 1}`);
                    if (prevLine) prevLine.classList.remove('highlight-line');
                }

                if (currentLine < lines.length) {
                    // Bật sáng dòng hiện tại
                    const activeLine = document.getElementById(`line-${currentLine}`);
                    if (activeLine) {
                        activeLine.classList.add('highlight-line');
                        activeLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    currentLine++;
                    // Thời gian chạy mỗi dòng (mặc định 600ms)
                    setTimeout(executeNextLine, 600);
                }
            }

            // Bắt đầu chạy dòng đầu tiên
            if (lines.length > 0) {
                executeNextLine();
            }
        }
    </script>

</body>
</html>
